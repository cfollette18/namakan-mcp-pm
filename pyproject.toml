[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "namakan-mcp-pm"
version = "0.3.1"
description = "Unified MCP server for project management (Jira, Asana, Monday, ClickUp, Smartsheet, MS Project, Trello)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Namakan AI Engineering" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
namakan-mcp-pm = "namakan_mcp_pm.server:main"

[project.urls]
Homepage = "https://github.com/cfollette18/namakan-mcp-pm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
namakan_mcp_pm = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
